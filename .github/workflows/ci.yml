name: ci
on:
    pull_request:
        branches: [develop]
    push:
        branches: [develop]
permissions:
    contents: read
jobs:
    ci:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: app
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version-file: app/go.mod
            - run: go build ./...
            # Guarded like the Loom config: `go test`/lint fail on a module with no packages.
            - id: pkgs
              run: if go list ./... 2>/dev/null | grep -q .; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo 'no Go packages yet'; fi
            - if: steps.pkgs.outputs.any == 'true'
              run: go test ./...
            - if: steps.pkgs.outputs.any == 'true'
              uses: golangci/golangci-lint-action@v6
              with:
                  version: latest
                  working-directory: app
