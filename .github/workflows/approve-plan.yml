name: approve-plan
on:
    workflow_dispatch:
        inputs:
            pr:
                description: "PR number of the plan to approve"
                required: true
                type: number
permissions:
    pull-requests: write
jobs:
    approve:
        runs-on: ubuntu-latest
        steps:
            - run: gh pr review "$PR" --approve --body "Plan approved by @$WHO via approve-plan workflow"
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  PR: ${{ inputs.pr }}
                  WHO: ${{ github.actor }}
