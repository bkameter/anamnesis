name: ci
on:
    pull_request:
        branches: [develop, main]
permissions:
    contents: read
jobs:
    build-test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: app
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version-file: app/go.mod
            - run: go build ./...
            # `go test` exits 1 on a module with no packages; skip it only then.
            - run: |
                  if [ -n "$(go list ./... 2>/dev/null)" ]; then go test ./...; fi
